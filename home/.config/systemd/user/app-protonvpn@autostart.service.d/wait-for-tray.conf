# Proton VPN is started at login from ~/.config/autostart/protonvpn.desktop
# (by uwsm in Hyprland, by gnome-session in GNOME). Delay it until the
# system tray exists, so it gets its tray icon and keeps running in the
# background when its window is closed. The VPN connection itself is kept by
# NetworkManager either way.
[Service]
ExecStartPre=%h/Scripts/wait-for-tray.sh
