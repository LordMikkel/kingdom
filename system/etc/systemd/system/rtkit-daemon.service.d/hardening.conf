[Service]
# Realtime scheduling does not need internet access
IPAddressDeny=any-
# It does not need to write to the system, only read configuration
ProtectSystem=strict
# No access to user home
ProtectHome=yes
PrivateTmp=yes
# Kernel
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
MemoryDenyWriteExecute=yes
# rtkit needs CAP_SYS_NICE to set process priorities.
CapabilityBoundingSet=CAP_SYS_NICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
RestrictSUIDSGID=yes
NoNewPrivileges=yes
