[Service]
# NetworkManager does not need to read your documents or photos.
ProtectHome=read-only
# Mounts /usr and /boot as read-only for the service.
ProtectSystem=true
# Gives it its own private /tmp. If an exploit writes to /tmp, you won't see it.
PrivateTmp=yes
# Prevents the service from modifying control groups (cgroups).
ProtectControlGroups=yes
#  Hides processes belonging to other users.
ProtectProc=invisible
