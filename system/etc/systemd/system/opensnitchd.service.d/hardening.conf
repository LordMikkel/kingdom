[Service]
# Make the root filesystem read-only for the service
ProtectSystem=strict
# Allow writing to config, logs, and database paths
ReadWritePaths=/etc/opensnitchd /var/log /var/lib/opensnitch
PrivateTmp=no
# Prevent the service from modifying /home (Read-only allows checking paths)
ProtectHome=read-only
# Prevent modification of kernel parameters
ProtectKernelTunables=yes
# Prevent modification of control groups
ProtectControlGroups=yes
# Anti-exploit: Prevent memory from being both writable and executable
MemoryDenyWriteExecute=yes
# Prevent the service from gaining new privileges
NoNewPrivileges=yes
# Restrict SUID/SGID to prevent privilege escalation
RestrictSUIDSGID=yes
