[Service]
# Filesystem Hardening
ProtectSystem=strict
# Make /home and /root inaccessible to the service
ProtectHome=yes
# Private /tmp directory
PrivateTmp=yes
# Protect kernel variables and cgroups
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
# Prevent memory from being Writable and Executable (W^X)
MemoryDenyWriteExecute=yes
# Prevent gaining new privileges
NoNewPrivileges=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
# Only allow sytem calls based on network and basic services
SystemCallFilter=@system-service @network-io
SystemCallErrorNumber=EPERM
