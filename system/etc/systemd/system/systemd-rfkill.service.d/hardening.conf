[Service]
# Filesystem
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# Kernel
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
MemoryDenyWriteExecute=yes
# Privileges
NoNewPrivileges=yes
# Remove almost all capabilities
CapabilityBoundingSet=CAP_NET_ADMIN
# Block internet access for this service (it only toggles hardware switches)
IPAddressDeny=any
