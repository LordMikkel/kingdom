[Service]
# Private /tmp directory
PrivateTmp=yes
# Prevent accessing /root
ProtectHome=read-only-
# Prevent altering kernel parameters
ProtectKernelTunables=yes
ProtectControlGroups=yes
# Prevent modifying kernel modules
ProtectKernelModules=yes
# Anti-exploit measure
MemoryDenyWriteExecute=yes-
# GDM usually doesn't need to act as a router
IPAddressDeny=any
