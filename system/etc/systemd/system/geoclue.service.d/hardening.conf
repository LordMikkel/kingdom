[Service]
# File system
ProtectSystem=strict
# Geoclue stores cached location data in /var/lib/geoclue
ReadWritePaths=/var/lib/geoclue
# No access to user home needed
ProtectHome=yes
PrivateTmp=yes
# Kernel
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
MemoryDenyWriteExecute=yes
# It only needs network access, no special root powers
CapabilityBoundingSet=
NoNewPrivileges=yes
RestrictSUIDSGID=yes
# Restrict to only what is needed for networking
SystemCallFilter=@system-service @network-io
