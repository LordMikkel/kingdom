[Service]
# Network
IPAddressDeny=any
# Filesystem
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
# Kernel
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectKernelModules=yes
MemoryDenyWriteExecute=yes
# Privileges-
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_DAC_OVERRIDE
NoNewPrivileges=yes
