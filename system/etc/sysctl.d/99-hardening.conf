# /etc/sysctl.d/99-hardening.conf
# Hardened Sysctl Configuration for Arch Linux
# Focused on Security, Privacy, and Anti-Exploitation

# ==============================================================================
# 1. KERNEL & MEMORY PROTECTION (Anti-Exploit)
# ==============================================================================

# Restrict access to kernel logs (dmesg) to root only.
# Prevents attackers from using kernel logs to plan exploits.
kernel.dmesg_restrict = 1

# Hide kernel memory addresses (pointers) from unprivileged users.
# Makes it harder to execute ROP (Return-Oriented Programming) attacks.
kernel.kptr_restrict = 2

# Force Address Space Layout Randomization (ASLR).
# Randomizes the positions of the stack, heap, and libraries in memory.
kernel.randomize_va_space = 2

# Restrict usage of the BPF JIT compiler to root only.
# BPF is a common attack vector in modern Linux kernels.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Disable the "Magic SysRq" key (except for critical sync/umount).
# Prevents physical attackers from rebooting/dumping memory easily.
kernel.sysrq = 0

# Restrict loading of TTY line disciplines (blocks some privilege escalation exploits).
dev.tty.ldisc_autoload = 0

# ==============================================================================
# 2. NETWORK: GENERAL & ANTI-SPOOFING
# ==============================================================================

# Enable IP Spoofing protection (Reverse Path Filter).
# Validates that packets are coming from a legitimate source path.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log packets with impossible addresses (Martians) to the kernel log.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP echo requests sent to broadcast/multicast addresses.
# Prevents Smurf attacks (DDoS amplification).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses.
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ==============================================================================
# 3. NETWORK: ANTI-MAN-IN-THE-MIDDLE (Redirects & Routing)
# ==============================================================================

# Disable ICMP Redirects.
# Prevents attackers from altering your routing table remotely.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Do not send ICMP Redirects (we are not a router).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable Source Routing.
# Attackers should not be able to dictate the path a packet takes.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ==============================================================================
# 4. NETWORK: DOS PROTECTION & PRIVACY
# ==============================================================================

# Enable TCP SYN Cookies.
# Protects against SYN Flood attacks (DDoS).
net.ipv4.tcp_syncookies = 1

# Protect against Time-Wait Assassination (RFC 1337).
net.ipv4.tcp_rfc1337 = 1

# Disable TCP Timestamps.
# Prevents fingerprinting system uptime (privacy gain).
net.ipv4.tcp_timestamps = 0

# IPv6 Privacy Extensions (RFC 4941).
# Generates temporary IPv6 addresses to prevent tracking.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# ==============================================================================
# 5. FILE SYSTEM HARDENING
# ==============================================================================
# Preventing SUID binary memory dumps 
fs.suid_dumpable = 0

# Prevent users from creating hardlinks/symlinks to files they don't own.
# Mitigates a large class of local privilege escalation vulnerabilities.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# Additional protection for FIFOs and regular files (modern kernels).
fs.protected_fifos = 2
fs.protected_regular = 2
